<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quote-app">
    <div class="mark">“</div>
    <p class="eyebrow">A LITTLE INSPIRATION</p>
    <h1>Random Quote Generator</h1>
    <section class="quote-card" aria-live="polite">
      <p id="quote">The secret of getting ahead is getting started.</p>
      <p id="author">— Mark Twain</p>
    </section>
    <button id="new-quote">New Quote</button>
    <p class="hint">A fresh thought, whenever you need one.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
